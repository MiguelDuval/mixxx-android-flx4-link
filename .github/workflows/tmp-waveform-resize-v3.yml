name: One-shot waveform resize v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-waveform-resize-v3.yml

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply and verify waveform-first mobile layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("res/qml/Deck.qml")
          s = p.read_text()
          original = s

          def replace_exact(old: str, new: str, expected: int = 1) -> None:
              global s
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f"Expected {expected} occurrences, found {count}: {old!r}")
              s = s.replace(old, new, expected)

          replace_exact(
              "Layout.preferredHeight: root.minimized ? 28 : 56",
              "Layout.preferredHeight: root.minimized ? 28 : 48",
          )

          # Normal deck only: make Play/Cue a horizontal pair so the lower strip
          # does not consume two full button heights vertically.
          play_cue_pattern = re.compile(
              r'(\{\s*"type":\s*")column("\s*,\s*"items":\s*\[\s*\{\s*"type":\s*"play"\s*\},\s*\{\s*"type":\s*"cue"\s*\}\s*\])',
              re.S,
          )
          matches = list(play_cue_pattern.finditer(s))
          if len(matches) != 2:
              raise SystemExit(f"Expected exactly two Play/Cue column definitions, found {len(matches)}")
          first = matches[0]
          target = s[first.start():first.end()].replace('"type": "column"', '"type": "row"', 1)
          s = s[:first.start()] + target + s[first.end():]

          replace_exact(
              "Layout.preferredHeight: root.minimized ? 32 : 60",
              "Layout.preferredHeight: root.minimized ? 32 : 68",
              expected=2,
          )
          replace_exact(
              "height: 92\n\n                DeckComponent.Loop",
              "height: 76\n\n                DeckComponent.Loop",
          )
          replace_exact(
              "height: 92\n\n                DeckComponent.BeatJump",
              "height: 76\n\n                DeckComponent.BeatJump",
          )
          replace_exact(
              "height: 92\n\n                DeckComponent.HotcueAndStem",
              "height: 76\n\n                DeckComponent.HotcueAndStem",
          )

          # Scope the waveform edit to the single DelegateChoice block, then
          # match only the two layout properties. This avoids YAML/Python indent
          # interactions entirely.
          block_start = s.index('roleValue: "waveformOverview"')
          block_end = s.index('roleValue: "fxAssign"', block_start)
          waveform_block = s[block_start:block_end]
          layout_pair = re.compile(
              r'(Layout\.fillHeight:\s*true\s*\n\s*Layout\.fillWidth:\s*true\s*\n)'
          )
          if len(layout_pair.findall(waveform_block)) != 1:
              raise SystemExit("Waveform layout fillHeight/fillWidth pair not found exactly once")
          waveform_block = layout_pair.sub(
              r'\1                Layout.preferredHeight: 76\n                Layout.minimumHeight: 64\n',
              waveform_block,
              count=1,
          )
          s = s[:block_start] + waveform_block + s[block_end:]

          if s == original:
              raise SystemExit("Patch produced no changes")

          normal_play_cue = re.findall(
              r'"type":\s*"row"\s*,\s*"items":\s*\[\s*\{\s*"type":\s*"play"\s*\},\s*\{\s*"type":\s*"cue"\s*\}\s*\]',
              s,
              re.S,
          )
          if len(normal_play_cue) != 1:
              raise SystemExit(f"Expected exactly one horizontal Play/Cue row after patch, found {len(normal_play_cue)}")

          waveform_block_start = s.index('roleValue: "waveformOverview"')
          waveform_block_end = s.index('roleValue: "fxAssign"', waveform_block_start)
          final_waveform_block = s[waveform_block_start:waveform_block_end]
          if final_waveform_block.count("Layout.preferredHeight: 76") != 1:
              raise SystemExit("Waveform preferredHeight is not present exactly once in its delegate")
          if final_waveform_block.count("Layout.minimumHeight: 64") != 1:
              raise SystemExit("Waveform minimumHeight is not present exactly once in its delegate")

          checks = {
              "normal loop 76": s.count("height: 76\n\n                DeckComponent.Loop") == 1,
              "normal beatjump 76": s.count("height: 76\n\n                DeckComponent.BeatJump") == 1,
              "normal hotcue 76": s.count("height: 76\n\n                DeckComponent.HotcueAndStem") == 1,
              "old loop 92": "height: 92\n\n                DeckComponent.Loop" not in s,
              "old beatjump 92": "height: 92\n\n                DeckComponent.BeatJump" not in s,
              "old hotcue 92": "height: 92\n\n                DeckComponent.HotcueAndStem" not in s,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Verification failed: " + ", ".join(failed))

          p.write_text(s)
          PY

          git diff --check
          echo "--- waveform delegate ---"
          grep -n -A16 -B2 'roleValue: "waveformOverview"' res/qml/Deck.qml
          echo "--- normal Play/Cue model ---"
          grep -n -A18 -B2 '"type": "row"' res/qml/Deck.qml | head -n 30
          echo "--- edited control heights ---"
          grep -n -E 'preferredHeight: root.minimized|Layout.preferredHeight: 76|Layout.minimumHeight: 64|height: 76|height: 140' res/qml/Deck.qml | head -n 40
          echo "--- diff stat ---"
          git diff --stat
          echo "--- Deck.qml diff ---"
          git diff -- res/qml/Deck.qml

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/qml/Deck.qml
          git rm -f .github/workflows/tmp-waveform-resize-v3.yml
          git commit -m "feat(android): use waveform-first mobile deck layout"
          git push origin HEAD:main
