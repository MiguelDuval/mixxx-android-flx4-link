name: One-shot waveform resize v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-waveform-resize-v3.yml

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply and verify waveform-first mobile layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("res/qml/Deck.qml")
          s = p.read_text()
          original = s

          def replace_exact(old: str, new: str, expected: int = 1) -> None:
              global s
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f"Expected {expected} occurrences, found {count}: {old!r}")
              s = s.replace(old, new, expected)

          # Keep the top track/info strip compact without making it visually tiny.
          replace_exact(
              "Layout.preferredHeight: root.minimized ? 28 : 56",
              "Layout.preferredHeight: root.minimized ? 28 : 48",
          )

          # In the normal deck, Play and Cue are consecutive children of the first
          # lower-strip column. Convert that first column into a horizontal row.
          play_cue_pattern = re.compile(
              r'(\{\s*"type":\s*")column("\s*,\s*"items":\s*\[\s*\{\s*"type":\s*"play"\s*\},\s*\{\s*"type":\s*"cue"\s*\}\s*\])',
              re.S,
          )
          matches = list(play_cue_pattern.finditer(s))
          if len(matches) != 2:
              raise SystemExit(f"Expected exactly two Play/Cue column definitions (normal + minimized), found {len(matches)}")
          first = matches[0]
          before = s[:first.start()]
          target = s[first.start():first.end()]
          after = s[first.end():]
          target = target.replace('"type": "column"', '"type": "row"', 1)
          s = before + target + after

          # Preserve comfortable touch areas while reducing only the vertical
          # budget of the lower control strip.
          replace_exact(
              "Layout.preferredHeight: root.minimized ? 32 : 60",
              "Layout.preferredHeight: root.minimized ? 32 : 68",
              expected=2,
          )
          replace_exact(
              "height: 92\n\n                DeckComponent.Loop",
              "height: 76\n\n                DeckComponent.Loop",
          )
          replace_exact(
              "height: 92\n\n                DeckComponent.BeatJump",
              "height: 76\n\n                DeckComponent.BeatJump",
          )
          replace_exact(
              "height: 92\n\n                DeckComponent.HotcueAndStem",
              "height: 76\n\n                DeckComponent.HotcueAndStem",
          )

          # Waveform-first sizing: 64 px is the deliberate mobile baseline;
          # fillHeight remains enabled so taller decks get proportionally more.
          marker = '''            LayoutItem {
                Layout.fillHeight: true
                Layout.fillWidth: true
                blurRadius: 4
                editLabel.color: Theme.white
                editLabel.font.pixelSize: 14
                editLabel.text: "Waveform overview"'''
          replacement = '''            LayoutItem {
                Layout.fillHeight: true
                Layout.fillWidth: true
                Layout.preferredHeight: 76
                Layout.minimumHeight: 64
                blurRadius: 4
                editLabel.color: Theme.white
                editLabel.font.pixelSize: 14
                editLabel.text: "Waveform overview"'''
          replace_exact(marker, replacement)

          if s == original:
              raise SystemExit("Patch produced no changes")

          # Safety checks validate the intended structure, not indentation.
          normal_play_cue = re.findall(
              r'"type":\s*"row"\s*,\s*"items":\s*\[\s*\{\s*"type":\s*"play"\s*\},\s*\{\s*"type":\s*"cue"\s*\}\s*\]',
              s,
              re.S,
          )
          if len(normal_play_cue) != 1:
              raise SystemExit(f"Expected exactly one horizontal Play/Cue row after patch, found {len(normal_play_cue)}")

          checks = {
              "waveform minimum": s.count("Layout.minimumHeight: 64") == 1,
              "waveform preferred": s.count("Layout.preferredHeight: 76") == 1,
              "normal loop 76": s.count("height: 76\n\n                DeckComponent.Loop") == 1,
              "normal beatjump 76": s.count("height: 76\n\n                DeckComponent.BeatJump") == 1,
              "normal hotcue 76": s.count("height: 76\n\n                DeckComponent.HotcueAndStem") == 1,
              "old loop 92": "height: 92\n\n                DeckComponent.Loop" not in s,
              "old beatjump 92": "height: 92\n\n                DeckComponent.BeatJump" not in s,
              "old hotcue 92": "height: 92\n\n                DeckComponent.HotcueAndStem" not in s,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Verification failed: " + ", ".join(failed))

          p.write_text(s)
          PY

          git diff --check
          echo "--- waveform delegate ---"
          grep -n -A14 -B2 'roleValue: "waveformOverview"' res/qml/Deck.qml
          echo "--- normal Play/Cue model ---"
          grep -n -A18 -B2 '"type": "row"' res/qml/Deck.qml | head -n 30
          echo "--- edited control heights ---"
          grep -n -E 'preferredHeight: root.minimized|height: 76|height: 140' res/qml/Deck.qml | head -n 30
          echo "--- diff stat ---"
          git diff --stat
          echo "--- Deck.qml diff ---"
          git diff -- res/qml/Deck.qml

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/qml/Deck.qml
          git rm -f .github/workflows/tmp-waveform-resize-v3.yml
          git commit -m "feat(android): use waveform-first mobile deck layout"
          git push origin HEAD:main
