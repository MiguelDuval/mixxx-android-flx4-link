name: One-shot waveform resize v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-waveform-resize-v3.yml

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply verified waveform layout patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("res/qml/Deck.qml")
          s = p.read_text()
          replacements = [
              ("Layout.preferredHeight: root.minimized ? 28 : 56", "Layout.preferredHeight: root.minimized ? 28 : 44", 1),
              ("height: 92\n\n                DeckComponent.Loop", "height: 64\n\n                DeckComponent.Loop", 1),
              ("height: 92\n\n                DeckComponent.BeatJump", "height: 64\n\n                DeckComponent.BeatJump", 1),
              ("Layout.preferredHeight: root.minimized ? 32 : 60", "Layout.preferredHeight: root.minimized ? 32 : 48", 2),
              ("height: 140\n                width: 140", "height: 112\n                width: 112", 1),
              ("height: 92\n\n                DeckComponent.HotcueAndStem", "height: 68\n\n                DeckComponent.HotcueAndStem", 1),
          ]
          for old, new, expected in replacements:
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f"Expected {expected} occurrences, found {count}: {old!r}")
              s = s.replace(old, new, expected)

          marker = '''            LayoutItem {
                Layout.fillHeight: true
                Layout.fillWidth: true
                blurRadius: 4
                editLabel.color: Theme.white
                editLabel.font.pixelSize: 14
                editLabel.text: "Waveform overview"'''
          replacement = '''            LayoutItem {
                Layout.fillHeight: true
                Layout.fillWidth: true
                Layout.preferredHeight: 150
                Layout.minimumHeight: 110
                blurRadius: 4
                editLabel.color: Theme.white
                editLabel.font.pixelSize: 14
                editLabel.text: "Waveform overview"'''
          if s.count(marker) != 1:
              raise SystemExit("Waveform delegate marker was not found exactly once")
          s = s.replace(marker, replacement, 1)
          p.write_text(s)
          PY

          git diff --check
          grep -n -A14 -B2 'roleValue: "waveformOverview"' res/qml/Deck.qml
          grep -n -A2 -B1 'DeckComponent.Loop' res/qml/Deck.qml | head -n 8
          grep -n -A2 -B1 'DeckComponent.BeatJump' res/qml/Deck.qml | head -n 8
          grep -n -A2 -B1 'DeckComponent.HotcueAndStem' res/qml/Deck.qml | head -n 8
          grep -n -A2 -B1 'height: 112' res/qml/Deck.qml | head -n 8
          git diff --stat
          git diff -- res/qml/Deck.qml

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/qml/Deck.qml
          git rm -f .github/workflows/tmp-waveform-resize-v3.yml
          git commit -m "feat(android): enlarge mobile deck waveforms"
          git push origin HEAD:main
