name: Apply PadFX and Effects fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Patch safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('res/qml/MainWindow.qml')
          text = main.read_text()
          old = '''                // Skin.EffectRow {\n                //     id: effects\n                //     visible: root.showEffects\n                //     width: parent.width\n                //\n                //     Skin.FadeBehavior on visible {\n                //         fadeTarget: effects\n                //     }\n                // }\n                Loader {'''
          new = '''                Loader {\n                    id: effects\n\n                    active: root.showEffects && !root.maximizeLibrary\n                    anchors.left: parent.left\n                    anchors.right: parent.right\n                    anchors.top: root.show4decks ? deck4.bottom : deck2.bottom\n                    height: item ? item.implicitHeight : 0\n                    visible: item !== null\n                    z: 2\n\n                    sourceComponent: Component {\n                        Skin.EffectRow {\n                            anchors.fill: parent\n                        }\n                    }\n                }\n                Loader {'''
          if old not in text:
              raise SystemExit('MainWindow EffectRow patch anchor not found')
          text = text.replace(old, new, 1)
          old = '''                    anchors {\n                        bottom: parent.bottom\n                        top: mixer.bottom\n                    }'''
          new = '''                    anchors {\n                        bottom: parent.bottom\n                        top: (effects.active && effects.item) ? effects.bottom : mixer.bottom\n                    }'''
          if old not in text:
              raise SystemExit('MainWindow library anchor patch anchor not found')
          text = text.replace(old, new, 1)
          main.write_text(text)

          effect_row = Path('res/qml/EffectRow.qml')
          text = effect_row.read_text()
          old = '''        Column {\n            width: parent.width / 2\n\n            Effects.EffectUnit {\n                unitNumber: 1\n                width: parent.width\n            }\n            Effects.EffectUnit {\n                unitNumber: 3\n                visible: showFourUnitsControl.value > 0\n                width: parent.width\n            }\n        }\n        Column {\n            width: parent.width / 2\n\n            Effects.EffectUnit {\n                unitNumber: 2\n                width: parent.width\n            }\n            Effects.EffectUnit {\n                unitNumber: 4\n                visible: showFourUnitsControl.value > 0\n                width: parent.width\n            }\n        }'''
          new = '''        Column {\n            width: parent.width / 2\n\n            Effects.EffectUnit {\n                unitNumber: 1\n                width: parent.width\n            }\n            Effects.EffectUnit {\n                unitNumber: 3\n                width: parent.width\n            }\n        }\n        Column {\n            width: parent.width / 2\n\n            Effects.EffectUnit {\n                unitNumber: 2\n                width: parent.width\n            }\n        }'''
          if old not in text:
              raise SystemExit('EffectRow unit layout patch anchor not found')
          effect_row.write_text(text.replace(old, new, 1))

          js = Path('res/controllers/Pioneer-DDJ-FLX4-script.js')
          text = js.read_text()
          old = '''        engine.setValue(unit, "show_focus", 1);\n        engine.setValue(unit, "group_" + channel + "_enable", 1);\n        engine.setValue(unit, "group_" + otherChannel + "_enable", 0);\n        PioneerDDJFLX4.padFx.mode[deckIndex] = 0;'''
          new = '''        // Pad FX units must contain a real EffectChain before their slots can\n        // accept next_effect/load commands. Keep them enabled and load the first\n        // non-empty chain preset when the unit is still empty.\n        engine.setValue(unit, "show_focus", 1);\n        engine.setValue(unit, "group_" + channel + "_enable", 1);\n        engine.setValue(unit, "group_" + otherChannel + "_enable", 0);\n        if (Math.floor(engine.getValue(unit, "loaded_chain_preset")) <= 0) {\n            engine.setValue(unit, "next_chain_preset", 1);\n        }\n        engine.setValue(unit, "enabled", 1);\n        PioneerDDJFLX4.padFx.mode[deckIndex] = 0;'''
          if old not in text:
              raise SystemExit('Pad FX initialization patch anchor not found')
          js.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git diff -- res/qml/MainWindow.qml res/qml/EffectRow.qml res/controllers/Pioneer-DDJ-FLX4-script.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/qml/MainWindow.qml res/qml/EffectRow.qml res/controllers/Pioneer-DDJ-FLX4-script.js
          git rm -f .github/workflows/fix-padfx-effects.yml
          git commit -m "Fix Pad FX chain initialization and lazy Effects UI"
          git push origin HEAD:main
