name: Android APK

# This repository intentionally keeps a single CI workflow: build the Android APK.
# FLX4 + Ableton Link + Android USB support are built from main.
# Mobile Pad FX panel + reliable effect-slot selection are now the active source.
# Trigger a clean APK build from the reviewed PadFX/mobile UI repair.
on:
  workflow_dispatch:
  push:
    branches: [main, experiment/waveform-constraint-2026-09-11]

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare Android build environment
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get clean
          source ./tools/android_buildenv.sh setup

      - name: Create temporary signing key
        shell: bash
        run: |
          PASS="mixxx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/mixxx.keystore" \
            -alias mixxx \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Mixxx Android Build"
          {
            echo "QT_ANDROID_KEYSTORE_ALIAS=mixxx"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=$PASS"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$PASS"
            echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mixxx.keystore"
          } >> "$GITHUB_ENV"

      - name: Configure Android
        shell: bash
        run: |
          set -o pipefail
          rm -rf build-android
          rm -rf "${BUILDENV_BASEPATH}/${BUILDENV_NAME}"
          mkdir -p build-android

          # The upstream Android dependency ZIP can occasionally arrive truncated.
          # Retry from a clean dependency directory so CMake never reuses a partial archive.
          for attempt in 1 2 3; do
            echo "=== Configure attempt ${attempt}/3 ==="
            rm -rf "${BUILDENV_BASEPATH}/${BUILDENV_NAME}"
            rm -rf build-android
            mkdir -p build-android
            if (cd build-android && cmake \
              -DCMAKE_TOOLCHAIN_FILE="${MIXXX_VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DCMAKE_SYSTEM_NAME=Android \
              -DBUILD_TESTING=OFF \
              -DBUILD_BENCH=OFF \
              ..); then
              echo "Android CMake configuration succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Android CMake configuration failed on attempt ${attempt}; retrying with a clean dependency directory."
            sleep 5
          done

          echo "Android CMake configuration failed after 3 clean attempts."
          exit 1

      - name: Build APK only
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-android --target apk --parallel 2 --verbose 2>&1 | tee "$RUNNER_TEMP/android-apk-build.log"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-build-log
          path: ${{ runner.temp }}/android-apk-build.log
          archive: true
          if-no-files-found: error
          retention-days: 14

      - name: Verify APK
        shell: bash
        run: |
          test -f build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          ls -lh build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-build-release-signed.apk
          path: build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 30