name: Android APK

# This repository intentionally keeps a single CI workflow: build the Android APK.
# FLX4 + Ableton Link + Android USB support are built from main.
# Mobile Pad FX panel + reliable effect-slot selection are now the active source.
# Trigger a clean APK build from the reviewed PadFX/mobile UI repair.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fix Android Ableton Link toolbar placement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("res/skins/LateNightQML/main.qml")
          text = path.read_text(encoding="utf-8")

          old = '''        anchors.top: parent.top\n        color: LateNightTheme.toolbarRootBackgroundColor\n        height: 26\n        visible: Qt.platform.os === "android"\n                && abletonLinkControl.initialized\n                && (!showMaximizedLibraryControl.initialized || showMaximizedLibraryControl.value <= 0.0)\n        width: 68\n        x: Math.max(2, Math.min(619, root.width - width - 2))\n        z: 10001'''
          new = '''        anchors.left: parent.left\n        anchors.top: parent.top\n        anchors.topMargin: 27\n        color: LateNightTheme.toolbarRootBackgroundColor\n        height: 34\n        visible: Qt.platform.os === "android"\n                && (!showMaximizedLibraryControl.initialized || showMaximizedLibraryControl.value <= 0.0)\n        width: 74\n        x: 190\n        z: 10001'''
          if old not in text:
              raise SystemExit("Expected Ableton Link overlay geometry block was not found")
          text = text.replace(old, new, 1)

          old3 = '''            anchors.left: parent.left\n            anchors.leftMargin: 2\n            anchors.top: parent.top\n            anchors.topMargin: 2'''
          new3 = '''            anchors.left: parent.left\n            anchors.leftMargin: 2\n            anchors.top: parent.top\n            anchors.topMargin: 4'''
          if old3 not in text:
              raise SystemExit("Expected Ableton Link button anchors were not found")
          text = text.replace(old3, new3, 1)

          old4 = '''            height: 20\n            width: 64'''
          new4 = '''            height: 26\n            width: 70'''
          if old4 not in text:
              raise SystemExit("Expected Ableton Link button size was not found")
          text = text.replace(old4, new4, 1)

          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/build.yml
          git add res/skins/LateNightQML/main.qml
          if git diff --cached --quiet; then
            echo "No Ableton Link UI changes needed."
          else
            git commit -m "fix: place Android Ableton Link beside BeatGrid [skip ci]"
            git push origin HEAD:main
          fi

      - name: Prepare Android build environment
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get clean
          source ./tools/android_buildenv.sh setup

      - name: Create temporary signing key
        shell: bash
        run: |
          PASS="mixxx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/mixxx.keystore" \
            -alias mixxx \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Mixxx Android Build"
          {
            echo "QT_ANDROID_KEYSTORE_ALIAS=mixxx"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=$PASS"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$PASS"
            echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mixxx.keystore"
          } >> "$GITHUB_ENV"

      - name: Configure Android
        shell: bash
        run: |
          set -o pipefail
          rm -rf build-android
          rm -rf "${BUILDENV_BASEPATH}/${BUILDENV_NAME}"
          mkdir -p build-android

          # The upstream Android dependency ZIP can occasionally arrive truncated.
          # Retry from a clean dependency directory so CMake never reuses a partial archive.
          for attempt in 1 2 3; do
            echo "=== Configure attempt ${attempt}/3 ==="
            rm -rf "${BUILDENV_BASEPATH}/${BUILDENV_NAME}"
            rm -rf build-android
            mkdir -p build-android
            if (cd build-android && cmake \
              -DCMAKE_TOOLCHAIN_FILE="${MIXXX_VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DCMAKE_SYSTEM_NAME=Android \
              -DBUILD_TESTING=OFF \
              -DBUILD_BENCH=OFF \
              ..); then
              echo "Android CMake configuration succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Android CMake configuration failed on attempt ${attempt}; retrying with a clean dependency directory."
            sleep 5
          done

          echo "Android CMake configuration failed after 3 clean attempts."
          exit 1

      - name: Build APK only
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-android --target apk --parallel 2 --verbose 2>&1 | tee "$RUNNER_TEMP/android-apk-build.log"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-build-log
          path: ${{ runner.temp }}/android-apk-build.log
          archive: true
          if-no-files-found: error
          retention-days: 14

      - name: Verify APK
        shell: bash
        run: |
          test -f build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          ls -lh build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-build-release-signed.apk
          path: build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 30