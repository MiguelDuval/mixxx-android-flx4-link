name: Android APK

# This repository intentionally keeps a single CI workflow: build the Android APK.
# FLX4 + Ableton Link + Android USB support are built from main.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch BitGrid toolbar placement for Android build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('res/skins/LateNightQML/Toolbar/Toolbar.qml')
          text = path.read_text(encoding='utf-8')

          block = '''            RowLayout {
                Layout.alignment: Qt.AlignVCenter
                spacing: -2

                // BitGrid 1 - Opens Deck 1 BeatGrid panel
                LateNightToolbarButton {
                    id: bitgrid1Button

                    buttonWidth: 70
                    text: "BitGrid 1"

                    onActivated: {
                        root.openPopupForButton(bitgrid1Popup, this);
                    }
                }
                LateNightToolbarDropButton {
                    popup: bitgrid1Popup
                    popupAnchor: bitgrid1Button

                    onClicked: {
                        root.openPopupForButton(popup, this);
                    }
                }

                // BitGrid 2 - Opens Deck 2 BeatGrid panel
                LateNightToolbarButton {
                    id: bitgrid2Button

                    buttonWidth: 70
                    text: "BitGrid 2"

                    onActivated: {
                        root.openPopupForButton(bitgrid2Popup, this);
                    }
                }
                LateNightToolbarDropButton {
                    popup: bitgrid2Popup
                    popupAnchor: bitgrid2Button

                    onClicked: {
                        root.openPopupForButton(popup, this);
                    }
                }
            }
'''

          if text.count(block) != 1:
              raise SystemExit(f'Expected exactly one BitGrid toolbar block, found {text.count(block)}')

          text = text.replace(block, '', 1)

          anchor = '''        LateNightToolbarMenuButton {
            id: appMenuButton

            popup: appMenuPopup
            visible: Qt.platform.os !== "osx"

            onClicked: {
                root.openPopupForButton(appMenuPopup, this);
            }
        }
'''

          if anchor not in text:
              raise SystemExit('Toolbar app-menu anchor not found')

          text = text.replace(anchor, anchor + block, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate BitGrid toolbar placement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('res/skins/LateNightQML/Toolbar/Toolbar.qml').read_text(encoding='utf-8')
          a = p.index('id: appMenuButton')
          b = p.index('id: bitgrid1Button')
          c = p.index('id: maximizeLibraryButton')
          assert a < b < c, (a, b, c)
          assert p.count('id: bitgrid1Button') == 1
          assert p.count('id: bitgrid2Button') == 1
          print('BitGrid 1/2 are in the leading visible toolbar section.')
          PY

      - name: Prepare Android build environment
        shell: bash
        run: |
          # The hosted Ubuntu image can occasionally ship a stale/mismatched
          # Google Chrome apt index. Chrome is not required to build Mixxx, and
          # its index can make apt-get update fail before sdkmanager is installed.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get clean
          source ./tools/android_buildenv.sh setup

      - name: Create temporary signing key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/mixxx.keystore" \
            -alias mixxx \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -storepass mixxx-build-password \
            -keypass mixxx-build-password \
            -dname "CN=Mixxx Android Build"
          {
            echo "QT_ANDROID_KEYSTORE_ALIAS=mixxx"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=mixxx-build-password"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=mixxx-build-password"
            echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mixxx.keystore"
          } >> "$GITHUB_ENV"

      - name: Configure Android
        shell: bash
        run: |
          mkdir -p build-android
          cd build-android
          cmake \
            -DCMAKE_TOOLCHAIN_FILE="$MIXXX_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_SYSTEM_NAME=Android \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCH=OFF \
            ..

      - name: Build APK only
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-android --target apk --parallel 2 --verbose 2>&1 | tee "$RUNNER_TEMP/android-apk-build.log"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-build-log
          path: ${{ runner.temp }}/android-apk-build.log
          archive: true
          if-no-files-found: error
          retention-days: 14

      - name: Verify APK
        shell: bash
        run: |
          test -f build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          ls -lh build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-build-release-signed.apk
          path: build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
