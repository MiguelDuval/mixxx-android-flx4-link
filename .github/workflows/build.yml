name: Android APK

# This repository intentionally keeps a single CI workflow: build the Android APK.
# FLX4 + Ableton Link + Android USB support are built from main.
# Mobile Pad FX panel + reliable effect-slot selection are now the active source.
# Trigger a clean APK build from the reviewed PadFX/mobile UI repair.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Stage Ableton Link toolbar UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("res/skins/LateNightQML/Toolbar/Toolbar.qml")
          text = path.read_text()
          marker = "// BEGIN PAPUSHA ABLETON LINK UI"
          if marker in text:
              print("Ableton Link toolbar UI already present; nothing to patch.")
              raise SystemExit(0)

          control_anchor = '''    Mixxx.ControlProxy {\n        id: bitgrid2Action\n\n        group: "[Channel2]"\n        key: "beats_translate_curpos"\n    }\n'''
          control_insert = control_anchor + '''    Mixxx.ControlProxy {\n        id: abletonLinkControl\n\n        group: "[AbletonLink]"\n        key: "sync_enabled"\n    }\n    Mixxx.ControlProxy {\n        id: abletonLinkPeersControl\n\n        group: "[AbletonLink]"\n        key: "num_peers"\n    }\n'''
          if control_anchor not in text:
              raise SystemExit("Ableton Link control insertion anchor not found")
          text = text.replace(control_anchor, control_insert, 1)

          visual_anchor = '''            RowLayout {\n                Layout.alignment: Qt.AlignVCenter\n                spacing: -2\n\n                // BitGrid 1 - Opens Deck 1 BeatGrid panel\n'''
          visual_insert = '''            // BEGIN PAPUSHA ABLETON LINK UI\n            RowLayout {\n                Layout.alignment: Qt.AlignVCenter\n                spacing: -2\n\n                LateNightToolbarButton {\n                    id: abletonLinkButton\n\n                    buttonWidth: 58\n                    checked: abletonLinkControl.initialized && abletonLinkControl.value > 0.0\n                    text: \"LINK\" + (abletonLinkPeersControl.initialized ? \" \" + Math.round(abletonLinkPeersControl.value) : \"\")\n                    enabled: abletonLinkControl.initialized\n\n                    onActivated: {\n                        abletonLinkControl.value = checked ? 1.0 : 0.0;\n                    }\n                }\n            }\n            // END PAPUSHA ABLETON LINK UI\n\n            RowLayout {\n                Layout.alignment: Qt.AlignVCenter\n                spacing: -2\n\n                // BitGrid 1 - Opens Deck 1 BeatGrid panel\n'''
          if visual_anchor not in text:
              raise SystemExit("Ableton Link visual insertion anchor not found")
          text = text.replace(visual_anchor, visual_insert, 1)

          path.write_text(text)
          print("Ableton Link toolbar UI staged successfully.")
          PY

          if git diff --quiet -- res/skins/LateNightQML/Toolbar/Toolbar.qml; then
            echo "No toolbar changes were generated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/skins/LateNightQML/Toolbar/Toolbar.qml
          git commit -m "feat: expose Ableton Link in mobile toolbar"
          git push origin HEAD:main

      - name: Prepare Android build environment
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get clean
          source ./tools/android_buildenv.sh setup

      - name: Create temporary signing key
        shell: bash
        run: |
          PASS="mixxx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/mixxx.keystore" \
            -alias mixxx \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Mixxx Android Build"
          {
            echo "QT_ANDROID_KEYSTORE_ALIAS=mixxx"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=$PASS"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$PASS"
            echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mixxx.keystore"
          } >> "$GITHUB_ENV"

      - name: Configure Android
        shell: bash
        run: |
          set -o pipefail
          rm -rf build-android
          rm -rf "${BUILDENV_BASEPATH}/${BUILDENV_NAME}"
          mkdir -p build-android

          # The upstream Android dependency ZIP can occasionally arrive truncated.
          # Retry from a clean dependency directory so CMake never reuses a partial archive.
          for attempt in 1 2 3; do
            echo "=== Configure attempt ${attempt}/3 ==="
            rm -rf "${BUILDENV_BASEPATH}/${BUILDENV_NAME}"
            rm -rf build-android
            mkdir -p build-android
            if (cd build-android && cmake \
              -DCMAKE_TOOLCHAIN_FILE="${MIXXX_VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DCMAKE_SYSTEM_NAME=Android \
              -DBUILD_TESTING=OFF \
              -DBUILD_BENCH=OFF \
              ..); then
              echo "Android CMake configuration succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Android CMake configuration failed on attempt ${attempt}; retrying with a clean dependency directory."
            sleep 5
          done

          echo "Android CMake configuration failed after 3 clean attempts."
          exit 1

      - name: Build APK only
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-android --target apk --parallel 2 --verbose 2>&1 | tee "$RUNNER_TEMP/android-apk-build.log"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-build-log
          path: ${{ runner.temp }}/android-apk-build.log
          archive: true
          if-no-files-found: error
          retention-days: 14

      - name: Verify APK
        shell: bash
        run: |
          test -f build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          ls -lh build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-build-release-signed.apk
          path: build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
