name: Android APK

# This repository intentionally keeps a single CI workflow: build the Android APK.
# FLX4 + Ableton Link + Android USB support are built from main.
# Mobile Pad FX panel + reliable effect-slot selection are now the active source.
# Trigger a clean APK build from the reviewed PadFX/mobile UI repair.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Finalize Ableton Link toolbar touch handling and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          toolbar = Path("res/skins/LateNightQML/Toolbar/Toolbar.qml")
          text = toolbar.read_text()
          start_marker = "            // BEGIN PAPUSHA ABLETON LINK UI\n"
          end_marker = "            // END PAPUSHA ABLETON LINK UI\n"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("Ableton Link toolbar marker not found")
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("Ableton Link toolbar end marker not found")
          end += len(end_marker)

          replacement = '''            // BEGIN PAPUSHA ABLETON LINK UI
            MouseArea {
                id: abletonLinkButton

                Layout.alignment: Qt.AlignVCenter
                Layout.preferredHeight: 20
                Layout.preferredWidth: 64
                acceptedButtons: Qt.LeftButton
                preventStealing: true
                hoverEnabled: false
                enabled: abletonLinkControl.initialized

                onPressed: {
                    if (abletonLinkControl.initialized) {
                        abletonLinkControl.value = abletonLinkControl.value > 0.0 ? 0.0 : 1.0;
                    }
                }

                LateNightToolbarButtonBackground {
                    active: abletonLinkControl.initialized && abletonLinkControl.value > 0.0
                }
                Text {
                    anchors.fill: parent
                    color: abletonLinkControl.initialized && abletonLinkControl.value > 0.0 ? LateNightTheme.toolbarButtonActiveTextColor : LateNightTheme.toolbarButtonInactiveTextColor
                    elide: Text.ElideRight
                    font {
                        family: "Open Sans"
                        pixelSize: 11
                        styleName: "Bold"
                        weight: Font.Bold
                    }
                    horizontalAlignment: Text.AlignHCenter
                    renderType: Text.NativeRendering
                    text: "LINK" + (abletonLinkPeersControl.initialized ? " " + Math.max(0, Math.round(abletonLinkPeersControl.value)) : "")
                    verticalAlignment: Text.AlignVCenter
                }
            }
            // END PAPUSHA ABLETON LINK UI
'''
          text = text[:start] + replacement + text[end:]
          toolbar.write_text(text)

          workflow = Path(".github/workflows/build.yml")
          workflow.write_text('''name: Android APK

# This repository intentionally keeps a single CI workflow: build the Android APK.
# FLX4 + Ableton Link + Android USB support are built from main.
# Mobile Pad FX panel + reliable effect-slot selection are now the active source.
# Trigger a clean APK build from the reviewed PadFX/mobile UI repair.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare Android build environment
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get clean
          source ./tools/android_buildenv.sh setup

      - name: Create temporary signing key
        shell: bash
        run: |
          PASS="mixxx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/mixxx.keystore" \
            -alias mixxx \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Mixxx Android Build"
          {
            echo "QT_ANDROID_KEYSTORE_ALIAS=mixxx"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=$PASS"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$PASS"
            echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mixxx.keystore"
          } >> "$GITHUB_ENV"

      - name: Configure Android
        shell: bash
        run: |
          set -o pipefail
          rm -rf build-android
          rm -rf "${BUILDENV_BASEPATH}/${BUILDENV_NAME}"
          mkdir -p build-android

          # The upstream Android dependency ZIP can occasionally arrive truncated.
          # Retry from a clean dependency directory so CMake never reuses a partial archive.
          for attempt in 1 2 3; do
            echo "=== Configure attempt ${attempt}/3 ==="
            rm -rf "${BUILDENV_BASEPATH}/${BUILDENV_NAME}"
            rm -rf build-android
            mkdir -p build-android
            if (cd build-android && cmake \
              -DCMAKE_TOOLCHAIN_FILE="${MIXXX_VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DCMAKE_SYSTEM_NAME=Android \
              -DBUILD_TESTING=OFF \
              -DBUILD_BENCH=OFF \
              ..); then
              echo "Android CMake configuration succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Android CMake configuration failed on attempt ${attempt}; retrying with a clean dependency directory."
            sleep 5
          done

          echo "Android CMake configuration failed after 3 clean attempts."
          exit 1

      - name: Build APK only
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-android --target apk --parallel 2 --verbose 2>&1 | tee "$RUNNER_TEMP/android-apk-build.log"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-build-log
          path: ${{ runner.temp }}/android-apk-build.log
          archive: true
          if-no-files-found: error
          retention-days: 14

      - name: Verify APK
        shell: bash
        run: |
          test -f build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          ls -lh build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-build-release-signed.apk
          path: build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
''')

          print("Ableton Link touch handling patched; CI workflow restored.")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/skins/LateNightQML/Toolbar/Toolbar.qml .github/workflows/build.yml
          git commit -m "fix: make Ableton Link toggle reliable on Android"
          git push origin HEAD:main

      - name: Prepare Android build environment
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get clean
          source ./tools/android_buildenv.sh setup

      - name: Create temporary signing key
        shell: bash
        run: |
          PASS="mixxx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/mixxx.keystore" \
            -alias mixxx \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Mixxx Android Build"
          {
            echo "QT_ANDROID_KEYSTORE_ALIAS=mixxx"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=$PASS"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$PASS"
            echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mixxx.keystore"
          } >> "$GITHUB_ENV"

      - name: Configure Android
        shell: bash
        run: |
          set -o pipefail
          rm -rf build-android
          rm -rf "${BUILDENV_BASEPATH}/${BUILDENV_NAME}"
          mkdir -p build-android

          # The upstream Android dependency ZIP can occasionally arrive truncated.
          # Retry from a clean dependency directory so CMake never reuses a partial archive.
          for attempt in 1 2 3; do
            echo "=== Configure attempt ${attempt}/3 ==="
            rm -rf "${BUILDENV_BASEPATH}/${BUILDENV_NAME}"
            rm -rf build-android
            mkdir -p build-android
            if (cd build-android && cmake \
              -DCMAKE_TOOLCHAIN_FILE="${MIXXX_VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DCMAKE_SYSTEM_NAME=Android \
              -DBUILD_TESTING=OFF \
              -DBUILD_BENCH=OFF \
              ..); then
              echo "Android CMake configuration succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Android CMake configuration failed on attempt ${attempt}; retrying with a clean dependency directory."
            sleep 5
          done

          echo "Android CMake configuration failed after 3 clean attempts."
          exit 1

      - name: Build APK only
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-android --target apk --parallel 2 --verbose 2>&1 | tee "$RUNNER_TEMP/android-apk-build.log"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-build-log
          path: ${{ runner.temp }}/android-apk-build.log
          archive: true
          if-no-files-found: error
          retention-days: 14

      - name: Verify APK
        shell: bash
        run: |
          test -f build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          ls -lh build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-build-release-signed.apk
          path: build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
