name: Android APK

# This repository intentionally keeps a single CI workflow: build the Android APK.
# FLX4 + Ableton Link + Android USB support are built from main.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare Android build environment
        shell: bash
        run: |
          source ./tools/android_buildenv.sh setup

      - name: Enable Android USB-MIDI backend
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Android does not define __PORTMIDI__, but the project already has
          # an Android USB-MIDI implementation in the PortMidi controller class.
          # Wire that existing enumerator into ControllerManager on Android.
          replace_once(
              "src/controllers/controllermanager.cpp",
              '#ifdef __PORTMIDI__\n#include "controllers/midi/portmidienumerator.h"\n#endif',
              '#if defined(__PORTMIDI__) || defined(__ANDROID__)\n#include "controllers/midi/portmidienumerator.h"\n#endif',
          )
          replace_once(
              "src/controllers/controllermanager.cpp",
              '#ifdef __PORTMIDI__\n        m_enumerators.push_back(std::make_unique<PortMidiEnumerator>(m_pConfig));\n#endif',
              '#if defined(__PORTMIDI__) || defined(__ANDROID__)\n        m_enumerators.push_back(std::make_unique<PortMidiEnumerator>(m_pConfig));\n#endif',
          )

          # The Android MIDI implementation is compiled through the existing
          # MIDI enumerator translation unit so we do not alter the global CMake
          # dependency graph that is already known to produce a working APK.
          replace_once(
              "src/controllers/midi/midienumerator.cpp",
              '#include "moc_midienumerator.cpp"\n',
              '#include "moc_midienumerator.cpp"\n\n#ifdef __ANDROID__\n#include "controllers/midi/portmidicontroller.cpp"\n#include "controllers/midi/portmidienumerator.cpp"\n#endif\n',
          )

          # Exclude desktop-only PortMidi API from the Android translation unit.
          replace_once(
              "src/controllers/midi/portmidienumerator.cpp",
              '#include <portmidi.h>\n',
              '#ifndef __ANDROID__\n#include <portmidi.h>\n#endif\n',
          )
          recognize_old = '''bool recognizeDevice(const PmDeviceInfo& deviceInfo, UserSettingsPointer pConfig) {
    // In developer mode we show the MIDI Through Port, otherwise ignore it
    // since it routinely causes trouble.
    return CmdlineArgs::Instance().getDeveloper() ||
            pConfig->getValue(kMidiThroughCfgKey, false) ||
            !QLatin1String(deviceInfo.name)
                     .startsWith(kMidiThroughPortPrefix, Qt::CaseInsensitive);
}
'''
          recognize_new = '''#ifndef __ANDROID__
bool recognizeDevice(const PmDeviceInfo& deviceInfo, UserSettingsPointer pConfig) {
    // In developer mode we show the MIDI Through Port, otherwise ignore it
    // since it routinely causes trouble.
    return CmdlineArgs::Instance().getDeveloper() ||
            pConfig->getValue(kMidiThroughCfgKey, false) ||
            !QLatin1String(deviceInfo.name)
                     .startsWith(kMidiThroughPortPrefix, Qt::CaseInsensitive);
}
#endif
'''
          replace_once(
              "src/controllers/midi/portmidienumerator.cpp",
              recognize_old,
              recognize_new,
          )

          ctor_old = '''PortMidiEnumerator::PortMidiEnumerator(UserSettingsPointer pConfig)
        : m_pConfig(pConfig) {
    PmError err = Pm_Initialize();
    // Based on reading the source, it's not possible for this to fail.
    if (err != pmNoError) {
        qWarning() << "PortMidi error:" << Pm_GetErrorText(err);
    }
}

PortMidiEnumerator::~PortMidiEnumerator() {
    qDebug() << "Deleting PortMIDI devices...";
    QListIterator<Controller*> dev_it(m_devices);
    while (dev_it.hasNext()) {
        delete dev_it.next();
    }
    PmError err = Pm_Terminate();
    // Based on reading the source, it's not possible for this to fail.
    if (err != pmNoError) {
        qWarning() << "PortMidi error:" << Pm_GetErrorText(err);
    }
}
'''
          ctor_new = '''PortMidiEnumerator::PortMidiEnumerator(UserSettingsPointer pConfig)
        : m_pConfig(pConfig) {
#ifndef __ANDROID__
    PmError err = Pm_Initialize();
    // Based on reading the source, it's not possible for this to fail.
    if (err != pmNoError) {
        qWarning() << "PortMidi error:" << Pm_GetErrorText(err);
    }
#endif
}

PortMidiEnumerator::~PortMidiEnumerator() {
    qDebug() << "Deleting PortMIDI devices...";
    QListIterator<Controller*> dev_it(m_devices);
    while (dev_it.hasNext()) {
        delete dev_it.next();
    }
#ifndef __ANDROID__
    PmError err = Pm_Terminate();
    // Based on reading the source, it's not possible for this to fail.
    if (err != pmNoError) {
        qWarning() << "PortMidi error:" << Pm_GetErrorText(err);
    }
#endif
}
'''
          replace_once(
              "src/controllers/midi/portmidienumerator.cpp",
              ctor_old,
              ctor_new,
          )

          print("Android USB-MIDI backend wired into APK build")
          PY

      - name: Create temporary signing key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/mixxx.keystore" \
            -alias mixxx \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -storepass mixxx-build-password \
            -keypass mixxx-build-password \
            -dname "CN=Mixxx Android Build"
          {
            echo "QT_ANDROID_KEYSTORE_ALIAS=mixxx"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=mixxx-build-password"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=mixxx-build-password"
            echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mixxx.keystore"
          } >> "$GITHUB_ENV"

      - name: Configure Android
        shell: bash
        run: |
          mkdir -p build-android
          cd build-android
          cmake \
            -DCMAKE_TOOLCHAIN_FILE="$MIXXX_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_SYSTEM_NAME=Android \
            -DBUILD_TESTING=OFF \
            -DBUILD_BENCH=OFF \
            ..

      - name: Build APK only
        shell: bash
        run: |
          cmake --build build-android --target apk --parallel 2

      - name: Verify APK
        shell: bash
        run: |
          test -f build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          ls -lh build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-build-release-signed.apk
          path: build-android/android-build/build/outputs/apk/release/android-build-release-signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 30