name: Verify PadFX Effects repair v3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Apply repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('res/qml/MainWindow.qml')
          text = main.read_text()
          marker_start = '                Loader {\n                    id: effects\n'
          start = text.find(marker_start)
          end = text.find('                Loader {\n                    id: library\n', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate embedded Effects loader')
          text = text[:start] + text[end:]
          anchor = 'top: (effects.active && effects.item) ? effects.bottom : mixer.bottom'
          text = text.replace(anchor, 'top: mixer.bottom', 1)
          overlay = '''    Loader {\n        id: effectsOverlay\n\n        active: root.showEffects && !root.maximizeLibrary\n        anchors.left: parent.left\n        anchors.right: parent.right\n        anchors.top: toolbar.bottom\n        anchors.bottom: parent.bottom\n        visible: item !== null\n        z: 100\n\n        sourceComponent: Component {\n            Skin.EffectRow {\n                anchors.fill: parent\n            }\n        }\n    }\n'''
          settings_marker = '    Skin.Settings {\n'
          if settings_marker not in text:
              raise SystemExit('Settings marker missing')
          text = text.replace(settings_marker, overlay + settings_marker, 1)
          main.write_text(text)

          xml = Path('res/controllers/Pioneer-DDJ-FLX4.midi.xml')
          x = xml.read_text()
          if '<group>[PadMode]</group>' not in x:
              raise SystemExit('Expected PadMode bindings missing')
          x = x.replace('<group>[PadMode]</group>', '<group>[Channel1]</group>')
          xml.write_text(x)

          js = Path('res/controllers/Pioneer-DDJ-FLX4-script.js')
          j = js.read_text()
          old_start = j.index('PioneerDDJFLX4.loadPadFxEffect = function')
          old_end = j.index('\n};', old_start) + 3
          old_block = j[old_start:old_end]
          if 'loaded_effect' not in old_block:
              raise SystemExit('Expected old PadFX loader block not found')
          new_block = '''PioneerDDJFLX4.loadPadFxEffect = function(deckIndex, slotIndex, targetEffect) {\n    const unit = PioneerDDJFLX4.padFx.units[deckIndex];\n    const slotGroup = `${unit}_Effect${slotIndex + 1}`;\n    const available = Math.floor(engine.getValue("[Master]", "num_effectsavailable"));\n\n    if (available <= 1) {\n        return false;\n    }\n\n    // Mixxx does not expose a loaded_effect index control. Start from empty and\n    // select deterministically via the supported next_effect control.\n    const steps = Math.max(1, (targetEffect % available) + 1);\n    engine.setValue(slotGroup, "clear", 1);\n    for (let step = 0; step < steps; step++) {\n        engine.setValue(slotGroup, "next_effect", 1);\n    }\n\n    engine.setValue(slotGroup, "enabled", 1);\n    engine.setValue(unit, "enabled", 1);\n    engine.setParameter(unit, "mix", 1);\n    return true;\n};'''
          j = j[:old_start] + new_block + j[old_end:]
          js.write_text(j)

          # Exact validation, printed for the CI log.
          final_main = main.read_text()
          final_xml = xml.read_text()
          final_js = js.read_text()
          checks = {
              'effectsOverlay': 'id: effectsOverlay' in final_main,
              'no_embedded_effects_loader': 'id: effects\n' not in final_main,
              'library_back_to_mixer': 'top: mixer.bottom' in final_main,
              'no_padmode_group': '<group>[PadMode]</group>' not in final_xml,
              'no_loaded_effect_control': 'loaded_effect' not in final_js,
              'uses_clear': 'engine.setValue(slotGroup, "clear", 1);' in final_js,
              'uses_next_effect': 'engine.setValue(slotGroup, "next_effect", 1);' in final_js,
          }
          for name, ok in checks.items():
              print(f'CHECK {name}: {ok}')
          if not all(checks.values()):
              raise SystemExit('One or more exact repair checks failed')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/qml/MainWindow.qml res/controllers/Pioneer-DDJ-FLX4.midi.xml res/controllers/Pioneer-DDJ-FLX4-script.js
          git rm -f .github/workflows/fix-padfx-effects-v3.yml
          git commit -m "Fix Pad FX selection and Effects UI overlay"
          git push origin HEAD:main
