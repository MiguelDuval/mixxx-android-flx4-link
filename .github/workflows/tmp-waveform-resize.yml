name: One-shot waveform resize

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-waveform-resize.yml

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply waveform-only layout patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('res/qml/Deck.qml')
          s = p.read_text()
          replacements = [
              ('Layout.preferredHeight: root.minimized ? 28 : 56', 'Layout.preferredHeight: root.minimized ? 28 : 44'),
              (r'height: 92\s+DeckComponent\.Loop', 'height: 72\n\n                DeckComponent.Loop'),
              (r'height: 92\s+DeckComponent\.BeatJump', 'height: 72\n\n                DeckComponent.BeatJump'),
              ('Layout.preferredHeight: root.minimized ? 32 : 60', 'Layout.preferredHeight: root.minimized ? 32 : 52'),
              (r'height: 140\s+width: 140', 'height: 112\n                width: 112'),
              (r'height: 92\s+DeckComponent\.HotcueAndStem', 'height: 72\n\n                DeckComponent.HotcueAndStem'),
          ]
          for old, new in replacements:
              if old.startswith(r''):
                  pattern = re.compile(old) if '\\s' in old or '\\.' in old else None
              else:
                  pattern = None
              if pattern is None:
                  count = s.count(old)
                  if count != 1:
                      raise SystemExit(f'Expected exactly one occurrence, found {count}: {old!r}')
                  s = s.replace(old, new, 1)
              else:
                  s, count = pattern.subn(new, s, count=1)
                  if count != 1:
                      raise SystemExit(f'Expected exactly one regex occurrence: {old!r}, found {count}')
          p.write_text(s)
          PY
          git diff --check
          git diff -- res/qml/Deck.qml
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add res/qml/Deck.qml
          git rm .github/workflows/tmp-waveform-resize.yml
          git commit -m 'feat(android): enlarge mobile deck waveforms'
          git push origin HEAD:main
