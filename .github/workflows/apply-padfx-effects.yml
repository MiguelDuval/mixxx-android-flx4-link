name: Apply Pad FX and Effects UI patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Apply patch and clean up
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_padfx_effects_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/qml/MainWindow.qml res/controllers/Pioneer-DDJ-FLX4-script.js
          git rm -f tools/apply_padfx_effects_patch.py .github/workflows/apply-padfx-effects.yml
          git commit -m "Implement FLX4 Pad FX and restore Effects panel"
          git push origin HEAD:main
