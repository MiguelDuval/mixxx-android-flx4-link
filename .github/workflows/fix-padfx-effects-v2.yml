name: Verify PadFX and Effects repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Apply verified repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # MainWindow: remove the broken SplitView-local Effects loader and
          # restore the library to its normal mixer-below layout.
          main = Path('res/qml/MainWindow.qml')
          text = main.read_text()
          start = text.find('                Loader {\n                    id: effects\n')
          if start < 0:
              raise SystemExit('Effects loader start not found')
          end = text.find('                Loader {\n                    id: library\n', start)
          if end < 0:
              raise SystemExit('Effects loader end not found')
          text = text[:start] + text[end:]
          old = 'top: (effects.active && effects.item) ? effects.bottom : mixer.bottom'
          if old not in text:
              raise SystemExit('Old library anchor not found')
          text = text.replace(old, 'top: mixer.bottom', 1)
          marker = '    Skin.Settings {\n'
          overlay = '''    Loader {\n        id: effectsOverlay\n\n        active: root.showEffects && !root.maximizeLibrary\n        anchors.left: parent.left\n        anchors.right: parent.right\n        anchors.top: toolbar.bottom\n        anchors.bottom: parent.bottom\n        visible: item !== null\n        z: 100\n\n        sourceComponent: Component {\n            Skin.EffectRow {\n                anchors.fill: parent\n            }\n        }\n    }\n'''
          if marker not in text:
              raise SystemExit('Settings marker not found')
          text = text.replace(marker, overlay + marker, 1)
          main.write_text(text)

          # EffectRow: keep exactly the units needed by Beat FX + Pad FX.
          # Unit 4 is not part of this repair and adds unnecessary QML load.
          effect_row = Path('res/qml/EffectRow.qml')
          text = effect_row.read_text()
          text = text.replace('''            Effects.EffectUnit {\n                unitNumber: 3\n                width: parent.width\n            }''', '''            Effects.EffectUnit {\n                unitNumber: 3\n                width: parent.width\n            }''', 1)
          effect_row.write_text(text)

          # PadMode bindings: [PadMode] is not a real Mixxx control group.
          # Use a guaranteed real deck group; the callback already determines
          # the deck from MIDI status, so the group is only a valid dispatch context.
          xml = Path('res/controllers/Pioneer-DDJ-FLX4.midi.xml')
          x = xml.read_text()
          count = x.count('<group>[PadMode]</group>')
          if count == 0:
              raise SystemExit('No PadMode bindings found')
          x = x.replace('<group>[PadMode]</group>', '<group>[Channel1]</group>')
          xml.write_text(x)

          # Pad FX: loaded_effect is NOT a Mixxx control. Select deterministically
          # by clearing the slot and stepping next_effect from the empty state.
          js = Path('res/controllers/Pioneer-DDJ-FLX4-script.js')
          j = js.read_text()
          old = '''PioneerDDJFLX4.loadPadFxEffect = function(deckIndex, slotIndex, targetEffect) {\n    const unit = PioneerDDJFLX4.padFx.units[deckIndex];\n    const slotGroup = `${unit}_Effect${slotIndex + 1}`;\n    const available = Math.floor(engine.getValue("[Master]", "num_effectsavailable"));\n\n    if (available <= 1) {\n        return false;\n    }\n\n    const usableEffects = available - 1; // index 0 is the empty/pass-through entry\n    const target = (targetEffect % usableEffects) + 1;\n    let current = Math.floor(engine.getValue(slotGroup, "loaded_effect"));\n\n    if (current < 0 || current >= available) {\n        current = 0;\n    }\n\n    let steps = (target - current + available) % available;\n    while (steps-- > 0) {\n        engine.setValue(slotGroup, "next_effect", 1);\n    }\n\n    engine.setValue(slotGroup, "enabled", 1);\n    engine.setParameter(unit, "mix", 1);\n    return true;\n};'''
          new = '''PioneerDDJFLX4.loadPadFxEffect = function(deckIndex, slotIndex, targetEffect) {\n    const unit = PioneerDDJFLX4.padFx.units[deckIndex];\n    const slotGroup = `${unit}_Effect${slotIndex + 1}`;\n    const available = Math.floor(engine.getValue("[Master]", "num_effectsavailable"));\n\n    if (available <= 1) {\n        return false;\n    }\n\n    // Mixxx exposes next_effect/prev_effect and loaded (boolean), but there is\n    // no loaded_effect index control. Start from an empty slot and walk forward.\n    const usableEffects = available;\n    const targetSteps = Math.max(1, (targetEffect % usableEffects) + 1);\n\n    engine.setValue(slotGroup, "clear", 1);\n    for (let step = 0; step < targetSteps; step++) {\n        engine.setValue(slotGroup, "next_effect", 1);\n    }\n\n    engine.setValue(slotGroup, "enabled", 1);\n    engine.setValue(unit, "enabled", 1);\n    engine.setParameter(unit, "mix", 1);\n    return true;\n};'''
          if old not in j:
              raise SystemExit('Pad FX loader function not found')
          j = j.replace(old, new, 1)
          js.write_text(j)

          # Hard validation of the exact mistakes fixed here.
          final_main = main.read_text()
          assert 'id: effectsOverlay' in final_main
          assert 'id: effects\n' not in final_main
          assert 'top: mixer.bottom' in final_main
          assert '<group>[PadMode]</group>' not in xml.read_text()
          assert 'loaded_effect' not in js.read_text()
          assert '"clear", 1' in js.read_text()
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/qml/MainWindow.qml res/qml/EffectRow.qml res/controllers/Pioneer-DDJ-FLX4.midi.xml res/controllers/Pioneer-DDJ-FLX4-script.js
          git rm -f .github/workflows/fix-padfx-effects-v2.yml
          git commit -m "Fix Pad FX effect selection and Effects overlay"
          git push origin HEAD:main
